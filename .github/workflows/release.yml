name: release

# 打 tag 即发布：使用 npm Trusted Publishing（OIDC），不需要任何 token。
# 前置：在 npm 包设置 → Trusted Publisher 里绑定本仓库与工作流名 release.yml。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Test
        run: node --test tests/*.test.mjs

      - name: Publish
        run: npm publish --provenance --access public
