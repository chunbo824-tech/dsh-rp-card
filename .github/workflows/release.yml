name: release

# 推 tag 时发布；也可以手动运行（只跑测试，不发布）。
# 发布使用 npm Trusted Publishing（OIDC），不需要 token。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      # 逐个文件跑，日志里能直接看出是哪个测试失败
      - name: Test
        run: |
          set -uo pipefail
          fail=0
          for f in tests/*.test.mjs; do
            echo "::group::$f"
            if node "$f"; then
              echo "OK $f"
            else
              echo "FAILED $f"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public
