name: release

# 推 tag 时发布；也可以手动运行（只跑测试，不发布）。
# 发布使用 npm Trusted Publishing（OIDC）：不需要 token，也不要写 registry-url，
# 否则 setup-node 会生成带 ${NODE_AUTH_TOKEN} 的 .npmrc，反而挡住 OIDC。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted Publishing 需要 npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      # 逐个文件跑，日志里能直接看出是哪个测试失败
      - name: Test
        run: |
          set -uo pipefail
          fail=0
          for f in tests/*.test.mjs; do
            echo "::group::$f"
            if node "$f"; then
              echo "OK $f"
            else
              echo "FAILED $f"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          npm_config_registry: https://registry.npmjs.org
        run: |
          set -o pipefail
          if npm publish --provenance --access public 2>&1 | tee /tmp/pub.log; then
            echo "published"
          else
            sed -e 's/%/%25/g' -e 's/\r//g' /tmp/pub.log \
              | grep -E "npm error|npm ERR|npm notice Publish|E[A-Z]{3,}|40[0-9]" \
              | tail -n 8 \
              | while IFS= read -r line; do
                  echo "::error title=publish::${line}"
                done
            exit 1
          fi
