name: debug-tests

# 临时排障工作流：在 Linux 上跑测试，把失败信息以 annotation 的形式写进 check-run，
# 这样不需要下载 Actions 日志也能读到（annotations API 是公开可读的）。
# 定位完成后删除本文件。

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: "!contains(github.event.head_commit.message, 'ci: record test log')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: |
          set -uo pipefail
          fail=0
          for f in tests/*.test.mjs; do
            echo "=== $f ==="
            if node "$f" > /tmp/out 2>&1; then
              echo "OK $f"
            else
              echo "FAILED $f"
              sed -e 's/%/%25/g' -e 's/\r//g' /tmp/out | grep -E "Error|error|assert|expected|actual|not ok|✖|at " | tail -n 8 | while IFS= read -r line; do
                echo "::error title=${f}::${line}"
              done
              fail=1
            fi
          done
          echo "exit=$fail"
          exit $fail
